# Render Blueprint - CommercePilot AI backend (FastAPI).
#
# Usage: Render dashboard -> New + -> Blueprint -> pick this repository.
# You can ignore this file and enter the same values manually in
# New + -> Web Service; DEPLOYMENT.md documents both paths.
services:
  - type: web
    name: commercepilot-ai-api
    runtime: python
    plan: free
    # Monorepo: requirements.txt is at the repository root, so the working
    # directory stays at the root and the app is imported as backend.main:app.
    rootDir: .
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      # Pin the interpreter we actually test with (local dev is Python 3.12).
      - key: PYTHON_VERSION
        value: "3.12"
      # REQUIRED: comma-separated allowed browser origins. Set the real value in
      # the Render dashboard (Sync: false = you supply it, it is never committed).
      - key: CORS_ORIGINS
        sync: false
      # Optional integrations - add in the dashboard, never commit values:
      #   OPENAI_API_KEY, SERPER_API_KEY, META_ACCESS_TOKEN, META_AD_ACCOUNT_ID,
      #   META_APP_ID, META_APP_SECRET, SHOPIFY_SHOP_DOMAIN, SHOPIFY_ADMIN_TOKEN
      # SQLite location. Free instances have NO persistent disk, so project data
      # resets when the instance restarts/deploys. To keep data, upgrade to a
      # paid instance, attach a disk and set DB_PATH=/data/commercepilot.sqlite3.
      # - key: DB_PATH
      #   value: /data/commercepilot.sqlite3
    # disk:
    #   name: commercepilot-data
    #   mountPath: /data
    #   sizeGB: 1
