# Render Blueprint — CommercePilot AI (free plan).
#
# Usage: Render dashboard → New + → Blueprint → pick this repository.
# DEPLOYMENT.md documents the same settings entered manually.
services:
  - type: web
    name: commercepilot-ai
    runtime: python
    plan: free
    # One process serves the Gradio UI at / and the JSON API at /api.
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py
    healthCheckPath: /api/health
    envVars:
      # Pin the interpreter the project is tested with.
      - key: PYTHON_VERSION
        value: "3.12"

      # --- optional: real AI output -------------------------------------
      # sync: false means "prompt me in the dashboard, never store in git".
      # Without a key the app runs in labelled template mode.
      - key: LLM_API_KEY
        sync: false
      # - key: LLM_MODEL
      #   value: openai/gpt-oss-20b
      # - key: LLM_MODEL_STRONG
      #   value: openai/gpt-oss-120b
      # - key: AI_MONTHLY_CAP_USD
      #   value: "25"

      # --- optional: richer live search --------------------------------
      # Key-free DuckDuckGo search is used when this is absent.
      # - key: SERPER_API_KEY
      #   sync: false

      # --- optional: persistent storage (paid disk only) ---------------
      # The free plan has no disk, so SQLite resets on restart. Attach a disk
      # and uncomment both lines to keep projects between deploys.
      # - key: DB_PATH
      #   value: /data/commercepilot.sqlite3
    # disk:
    #   name: commercepilot-data
    #   mountPath: /data
    #   sizeGB: 1
