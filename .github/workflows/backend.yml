name: Backend checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test-password
          POSTGRES_DB: commercepilot_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:test-password@localhost:5432/commercepilot_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Check serverless startup with only production dependencies
        env:
          VERCEL: '1'
          APP_MODE: production
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
          LLM_API_KEY: ci-placeholder-not-a-real-key
        run: |
          python -m venv "$RUNNER_TEMP/serverless-runtime"
          "$RUNNER_TEMP/serverless-runtime/bin/python" -m pip install -r requirements.txt
          "$RUNNER_TEMP/serverless-runtime/bin/python" -m scripts.check_serverless_startup
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest
      - run: python -m ruff check commercepilot app.py api tests scripts
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend run build
      - run: cd frontend && npx playwright install --with-deps chromium
      - run: npm --prefix frontend run test:e2e
